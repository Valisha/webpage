name: Daily Netlify Build
on:
  schedule:
    - cron: '0 6 * * *'  # runs every day at 6am UTC
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether a build is actually needed
        id: check
        run: |
          result=$(node scripts/needs-daily-build.mjs)
          echo "needs_build=$result" >> "$GITHUB_OUTPUT"

      - name: Trigger Netlify build
        if: steps.check.outputs.needs_build == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST -d '{}' https://api.netlify.com/build_hooks/69ecc74de043a441ba3ace85
